name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Bun нужен и для установки, и самим тестам: фикстуры «трафика Sentry» запускают настоящий Sentry.init под Bun.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare types
        run: bun run prepare:types

      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run fmt:check

      - name: Types
        run: bun run test:types

      - name: Test
        run: bun run test

      # dist/ лежит в git (потребитель ставит пакет с GitHub, prepack там не запускается): забытая пересборка = релиз без правки.
      - name: dist совпадает со сборкой из src
        run: |
          bun run build
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --short -- dist
            git diff -- dist
            echo "::error::dist/ не совпадает со сборкой из src/: выполните bun run build и закоммитьте dist/"
            exit 1
          fi
